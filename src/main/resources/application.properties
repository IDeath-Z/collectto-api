spring.application.name=api_collectto
spring.config.import=optional:file:.env[.properties]

# Token hash
jwt.secret=${JWT_SECRET}

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Oracle cloud bucket configuration
oracle.cloud.tenantId=${ORACLE_TENANT_ID}
oracle.cloud.userId=${ORACLE_USER_ID}
oracle.cloud.fingerprint=${ORACLE_FINGERPRINT}
oracle.cloud.region=${ORACLE_REGION}
oracle.cloud.namespace=${ORACLE_NAMESPACE}
oracle.cloud.bucket=${ORACLE_BUCKET}
oracle.cloud.privateKey=${ORACLE_PRIVATE_KEY}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB